services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: programacion-iv-app
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      # vendor/ vive en un volumen de Docker: leer miles de archivos desde un disco de Windows
      # (WSL / Docker Desktop) hacía que cada página tardara varios segundos.
      - vendor_data:/var/www/html/vendor
    # Instala o actualiza las dependencias en el volumen (rápido si ya están) y levanta el servidor.
    command: sh -c "composer install --no-interaction --prefer-dist && php artisan serve --host=0.0.0.0 --port=8000"
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      PHP_CLI_SERVER_WORKERS: 4
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: programacion_iv
      DB_USERNAME: laravel
      DB_PASSWORD: laravel
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: programacion-iv-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: programacion_iv
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  vendor_data:
