services:
  app:
    image: blackmultimarca-development-app:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: programacion-iv-app
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      # vendor/ vive en un volumen de Docker: leer miles de archivos desde un disco de Windows
      # (WSL / Docker Desktop) hacía que cada página tardara varios segundos.
      - vendor_data:/var/www/html/vendor
    # Instala dependencias solo al inicializar el volumen; los cambios de lockfile se aplican manualmente.
    command: sh -c "if [ ! -f vendor/autoload.php ]; then composer install --no-interaction --prefer-dist; fi && php artisan serve --host=0.0.0.0 --port=8000 --no-reload"
    ports:
      - "8000:8000"
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    environment:
      APP_ENV: local
      PHP_CLI_SERVER_WORKERS: 4
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: programacion_iv
      DB_USERNAME: laravel
      DB_PASSWORD: laravel
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: programacion-iv-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: programacion_iv
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    image: node:22-alpine
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - node_modules_data:/var/www/html/node_modules
    command: sh -c "if [ ! -d node_modules/vite ]; then npm ci; fi && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    init: true

  scheduler:
    image: blackmultimarca-development-app:local
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
    command: ["php", "artisan", "schedule:work"]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy

volumes:
  mysql_data:
  vendor_data:
  node_modules_data:
