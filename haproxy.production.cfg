global
    log stdout format raw local0
    maxconn 2048

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    timeout http-request 15s
    timeout http-keep-alive 10s

resolvers docker
    nameserver dns 127.0.0.11:53
    accepted_payload_size 8192
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s
    hold obsolete 10s
    hold nx 3s
    hold timeout 3s
    hold refused 3s
    hold other 3s

frontend http
    bind :8080
    default_backend web_nodes

backend web_nodes
    balance roundrobin
    option httpchk
    http-check send meth GET uri /up ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    # Preserve forwarding headers supplied by the existing trusted HTTPS proxy.
    server-template web 1-10 web:8080 check inter 5s fall 3 rise 2 resolvers docker resolve-prefer ipv4 init-addr none
